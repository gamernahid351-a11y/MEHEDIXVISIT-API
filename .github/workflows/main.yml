name: Generate JWT

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

jobs:
  generate-jwt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate JWT
        run: |
          python generate_jwt.py
